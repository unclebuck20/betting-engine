<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Picks</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
<style>
:root{
  --bg:#f6f5f2;--card:#ffffff;--ink:#16181d;--muted:#667085;--line:#e4e2dc;
  --accent:#1f6f4a;--accent-ink:#ffffff;--lean:#8a6a12;--lean-bg:#fbf3dc;--pass:#8a8f98;
  --play-bg:#e3f2ea;--chip:#efeee9;--danger:#a33a2b;--shadow:0 1px 2px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--card:#171a20;--ink:#e8e9ec;--muted:#98a0ad;--line:#262a33;
  --accent:#3fb37f;--accent-ink:#0b1410;--lean:#e2bd5a;--lean-bg:#2a2414;--pass:#6b7280;
  --play-bg:#13281e;--chip:#20242c;--danger:#e0725f;--shadow:none;}}
:root[data-theme="dark"]{
  --bg:#0f1115;--card:#171a20;--ink:#e8e9ec;--muted:#98a0ad;--line:#262a33;
  --accent:#3fb37f;--accent-ink:#0b1410;--lean:#e2bd5a;--lean-bg:#2a2414;--pass:#6b7280;
  --play-bg:#13281e;--chip:#20242c;--danger:#e0725f;--shadow:none;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 60px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:4px 0 14px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.updated{color:var(--muted);font-size:12.5px;text-align:right}
.views{display:flex;gap:6px;margin-bottom:12px}
.views button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.tab small{color:var(--muted);font-weight:500;margin-left:5px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab[aria-selected="true"] small{color:inherit;opacity:.8}
.slotnote{color:var(--muted);font-size:13px;margin:-4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.pass{opacity:.72}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.matchup{font-size:13px;color:var(--muted)}
.time{font-size:12.5px;color:var(--muted);white-space:nowrap}
.pick{font-size:19px;font-weight:700;margin:6px 0 2px;letter-spacing:-.01em}
.book{font-size:12.5px;color:var(--muted)}
.tier{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;margin-right:6px;vertical-align:2px}
.tier.play{background:var(--play-bg);color:var(--accent)}
.tier.lean{background:var(--lean-bg);color:var(--lean)}
.tier.pass{background:var(--chip);color:var(--pass)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 10px}
.stat{background:var(--chip);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}
.why{font-size:14px;margin:0 0 8px}
.floor{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.flags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.flag{font-size:11.5px;color:var(--muted);background:var(--chip);border-radius:6px;padding:2px 7px}
.flag.warn{color:var(--danger)}
.actions{display:flex;gap:8px;align-items:center}
.took{flex:1;border:0;border-radius:10px;padding:11px;font-weight:700;font-size:14.5px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.took[disabled]{background:var(--chip);color:var(--muted);cursor:default}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.foot{color:var(--muted);font-size:12px;margin-top:24px}
.foot a{color:inherit}
.theme{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;padding:3px 8px;font-size:12px;cursor:pointer;margin-top:4px}
@media (max-width:420px){.pick{font-size:17px}.stat b{font-size:15.5px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Picks</h1>
    <div class="updated"><div id="updated">Loading…</div><button class="theme" id="theme">Theme</button></div>
  </header>
  <div class="views">
    <button id="v-picks" aria-pressed="true">Picks</button>
    <button id="v-bets" aria-pressed="false">My bets</button>
  </div>
  <section id="picks-view">
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <p class="slotnote" id="slotnote"></p>
    <div id="cards"></div>
  </section>
  <section id="bets-view" hidden>
    <div class="summary" id="bet-summary"></div>
    <div id="bets"></div>
  </section>
  <p class="foot">Lines from The Odds API; fair line from the sharpest available book with the vig removed. College model: PPA power ratings (CollegeFootballData). NFL: nflverse efficiency + ESPN injury reports. Confidence = chance this side covers at the listed number. <a href="https://github.com/unclebuck20/betting-engine">Source</a></p>
</div>
<script>
const REPO = "unclebuck20/betting-engine";
const SLOTS = [
  ["thu","Thursday","TNF or Thursday college: best single pick"],
  ["fri","Friday","Friday college: best single pick"],
  ["sat","Saturday","College: up to 10 best bets"],
  ["sun","Sunday","NFL early + afternoon: up to 10 best bets"],
  ["snf","SNF","Sunday night: one pick"],
  ["mnf","MNF","Monday night: one pick"],
];
const BOOK = {draftkings:"DraftKings", fanduel:"FanDuel"};
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let DATA=null, BETS=[], slot=null;
const $=s=>document.querySelector(s);
const fmtLine=x=>x===0?"PK":(x>0?"+":"")+x;
const fmtPrice=p=>(p>0?"+":"")+p;
const ago=iso=>{const m=Math.round((Date.now()-new Date(iso))/60000);return m<60?`${m} min ago`:m<1440?`${Math.round(m/60)} hr ago`:`${Math.round(m/1440)} d ago`};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function theme(){
  const t=store.get("theme",null); if(t) document.documentElement.dataset.theme=t;
  $("#theme").onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
    const nx=cur==="dark"?"light":"dark";document.documentElement.dataset.theme=nx;store.set("theme",nx)};
}

function defaultSlot(){
  const now=Date.now();
  let best=null;
  for(const [k] of SLOTS){const b=DATA.board[k];if(!b)continue;
    const times=(b.picks.length?b.picks:[]).map(p=>+new Date(p.kickoff_utc)).filter(t=>t>now);
    const t=times.length?Math.min(...times):null; if(t&&(!best||t<best.t)) best={k,t};}
  return best?best.k:(SLOTS.find(([k])=>DATA.board[k])||["thu"])[0];
}

function renderTabs(){
  $("#tabs").innerHTML=SLOTS.map(([k,label])=>{
    const b=DATA.board[k]; const n=b?b.picks.filter(p=>p.tier!=="pass").length:0;
    return `<button class="tab" role="tab" aria-selected="${k===slot}" data-k="${k}">${label}<small>${b?n:"–"}</small></button>`}).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{slot=b.dataset.k;store.set("slot",slot);render()});
}

function takenKey(c){return `${c.id}|${c.side}`}
function isTaken(c){return BETS.some(b=>b.pick_key===takenKey(c)) || store.get("taken",{})[takenKey(c)]}

function card(c){
  const flags=(c.flags||[]).map(f=>`<span class="flag ${/suspicious|verify|disagree|missing/.test(f)?"warn":""}">${esc(f)}</span>`).join("");
  const taken=isTaken(c);
  const btn=c.tier==="pass"?`<button class="took" disabled>No bet</button>`
    :taken?`<button class="took" disabled>✓ Logged</button>`
    :`<button class="took" data-id="${esc(c.id)}">Took it</button>`;
  return `<article class="card ${c.tier}">
    <div class="top"><div class="matchup">${esc(c.matchup)}</div><div class="time">${esc(c.kickoff_pt)}</div></div>
    <div class="pick"><span class="tier ${c.tier}">${c.tier}</span>${esc(c.side)} ${fmtLine(c.line)} <span style="font-weight:600">(${fmtPrice(c.price)})</span></div>
    <div class="book">at ${BOOK[c.book]||esc(c.book)}${c.floor_text?` · ${esc(c.floor_text)}`:""}</div>
    <div class="stats">
      <div class="stat"><b>${c.confidence.toFixed(1)}%</b><span>Confidence</span></div>
      <div class="stat"><b>${c.units?c.units.toFixed(1)+"u":"—"}</b><span>Units</span></div>
      <div class="stat"><b>${c.ev_pct>0?"+":""}${c.ev_pct.toFixed(1)}%</b><span>Edge (EV)</span></div>
    </div>
    <p class="why">${esc(c.why)}</p>
    ${flags?`<div class="flags">${flags}</div>`:""}
    <div class="actions">${btn}</div>
  </article>`;
}

function render(){
  renderTabs();
  const meta=SLOTS.find(([k])=>k===slot); const b=DATA.board[slot];
  $("#slotnote").textContent=meta[2]+(b?` · ${b.games} games checked, ${b.picks.filter(p=>p.tier!=="pass").length} bet${b.picks.filter(p=>p.tier!=="pass").length===1?"":"s"}`:"");
  if(!b||!b.picks.length){$("#cards").innerHTML=`<div class="empty">${b?"No game on this slate is priced wrong enough to bet. Passing is a position.":"No games on the board for this slot yet. Lines usually post by Sunday night."}</div>`;return}
  $("#cards").innerHTML=b.picks.map(card).join("");
  document.querySelectorAll(".took[data-id]").forEach(btn=>btn.onclick=()=>took(b.picks.find(p=>p.id===btn.dataset.id)));
}

function took(c){
  const key=takenKey(c);
  const body=[
    "Edit line / price / units below if you got a different number, then click Submit.",
    "",
    `pick_key: ${key}`,
    `pick: ${c.side} ${fmtLine(c.line)} (${fmtPrice(c.price)})`,
    `matchup: ${c.matchup}`,
    `kickoff_utc: ${c.kickoff_utc}`,
    `league: ${c.league}`,
    `book: ${c.book}`,
    `line: ${c.line}`,
    `price: ${c.price}`,
    `units: ${c.units||0.5}`,
    `model_tier: ${c.tier}`,
    `model_ev_pct: ${c.ev_pct}`,
  ].join("\n");
  const url=`https://github.com/${REPO}/issues/new?title=${encodeURIComponent("BET: "+c.side+" "+fmtLine(c.line))}&body=${encodeURIComponent(body)}`;
  const t=store.get("taken",{});t[key]=Date.now();store.set("taken",t);
  window.open(url,"_blank","noopener");
  render();
}

function renderBets(){
  const settled=BETS.filter(b=>b.result&&b.result!=="pending");
  const u=settled.reduce((s,b)=>s+(+b.units_won||0),0);
  const clv=BETS.filter(b=>b.clv_pts!==undefined&&b.clv_pts!=="");
  const avgClv=clv.length?clv.reduce((s,b)=>s+ +b.clv_pts,0)/clv.length:null;
  const w=settled.filter(b=>b.result==="win").length,l=settled.filter(b=>b.result==="loss").length;
  $("#bet-summary").innerHTML=`
    <div class="stat"><b>${w}-${l}</b><span>Record</span></div>
    <div class="stat"><b>${u>=0?"+":""}${u.toFixed(1)}u</b><span>Units won</span></div>
    <div class="stat"><b>${avgClv===null?"—":(avgClv>=0?"+":"")+avgClv.toFixed(1)}</b><span>Avg CLV (pts)</span></div>`;
  if(!BETS.length){$("#bets").innerHTML=`<div class="empty">No bets logged yet. Tap <b>Took it</b> on a card, then Submit on the GitHub page that opens.</div>`;return}
  $("#bets").innerHTML=`<table><thead><tr><th>Bet</th><th>Book</th><th class="num">Units</th><th class="num">Result</th></tr></thead><tbody>${
    BETS.slice().reverse().map(b=>`<tr><td>${esc(b.pick)}<br><span class="book">${esc(b.matchup)}</span></td><td>${BOOK[b.book]||esc(b.book)}</td><td class="num">${esc(b.units)}</td><td class="num">${esc(b.result||"pending")}</td></tr>`).join("")
  }</tbody></table>`;
}

function views(){
  const set=v=>{$("#picks-view").hidden=v!=="picks";$("#bets-view").hidden=v!=="bets";
    $("#v-picks").setAttribute("aria-pressed",v==="picks");$("#v-bets").setAttribute("aria-pressed",v==="bets");if(v==="bets")renderBets()};
  $("#v-picks").onclick=()=>set("picks");$("#v-bets").onclick=()=>set("bets");
}

async function load(){
  theme();views();
  try{
    const [p,b]=await Promise.all([fetch("data/picks.json",{cache:"no-store"}),fetch("data/bets.json",{cache:"no-store"}).catch(()=>null)]);
    DATA=await p.json();
    BETS=b&&b.ok?await b.json():[];
  }catch(e){$("#cards").innerHTML=`<div class="empty">Couldn't load picks (${esc(e.message)}).</div>`;$("#updated").textContent="";return}
  $("#updated").textContent=`Updated ${ago(DATA.meta.built_at)}`;
  const saved=store.get("slot",null);
  slot=defaultSlot();
  if(saved&&DATA.board[saved]&&sessionStorage.getItem("visited"))slot=saved;
  try{sessionStorage.setItem("visited","1")}catch(e){}
  render();
}
load();
</script>
</body>
</html>

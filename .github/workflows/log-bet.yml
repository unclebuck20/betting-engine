name: log-bet

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  log:
    if: startsWith(github.event.issue.title, 'BET:') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Log bet
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python scripts/log_bet.py
      - name: Commit (retries if a refresh pushed at the same moment)
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          git config user.name "betting-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bets.csv docs/data/bets.json
          git commit -m "bet: issue #${{ github.event.issue.number }}" -m "$TITLE"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs --autostash origin main && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }} -c "Logged ✅"

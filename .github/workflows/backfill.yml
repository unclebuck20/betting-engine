name: backfill

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/fetch_cfb_history.py", ".github/workflows/backfill.yml"]

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cfb-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Pull college history
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/fetch_cfb_history.py
      - name: Commit
        run: |
          git config user.name "betting-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/cfbd_history
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: college history backfill"
          git pull --rebase --autostash origin main
          git push

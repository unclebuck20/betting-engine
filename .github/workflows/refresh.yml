name: refresh

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Pull odds now even if not due"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ["scripts/**", "requirements.txt", ".github/workflows/refresh.yml"]
  schedule:
    # GitHub starts scheduled jobs late (often by hours at :00), so wake every 30 minutes at odd minutes
    # and let scripts/schedule.py decide what's due. Odds (3 credits) are pulled once each morning and
    # before each kickoff window, only for the league kicking off: ~200-250 of the 500 monthly credits.
    - cron: "11,41 * * * *"

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Decide what's due
        id: decide
        env:
          FORCE: ${{ github.event_name == 'push' || inputs.force == true }}
        run: python scripts/schedule.py
      - name: Install
        if: steps.decide.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Fetch
        if: steps.decide.outputs.run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODD_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ODDS_PULL: ${{ steps.decide.outputs.odds }}
        run: python scripts/fetch.py
      - name: Price edges
        if: steps.decide.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/edge.py
      - name: NFL injuries
        if: steps.decide.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/injuries.py
      - name: NFL play-by-play features (current season)
        if: steps.decide.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/nfl_features.py refresh 2026
      - name: NFL model (ratings, QBs, spreads, totals)
        if: steps.decide.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/nfl_model.py live 2026
      - name: Picks
        if: steps.decide.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/picks.py
      - name: Grade (closing lines, results, CLV)
        if: steps.decide.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/grade.py
      - name: Calibrate (weekly; skips if run in the last 6 days)
        if: steps.decide.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/calibrate.py
      - name: Commit if changed (always, so paid odds snapshots are never lost)
        if: always() && steps.decide.outputs.run == 'true'
        run: |
          git config user.name "betting-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then echo "::notice::no data changes"; exit 0; fi
          git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do git pull --rebase -X theirs --autostash origin main && git push && exit 0; sleep $((i * 10)); done
          exit 1

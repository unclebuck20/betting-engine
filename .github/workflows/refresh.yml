name: refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "requirements.txt", ".github/workflows/refresh.yml"]
  # Game-day schedule added after the first manual pull is profiled.

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch
        env:
          ODDS_API_KEY: ${{ secrets.ODD_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/fetch.py
      - name: Price edges
        run: python scripts/edge.py
      - name: Commit if changed
        run: |
          git config user.name "betting-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw data/edges
          if git diff --cached --quiet; then echo "::notice::no data changes"; exit 0; fi
          git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
